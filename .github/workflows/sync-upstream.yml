name: Apply patches to new upstream tags

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write

concurrency:
  group: upstream-tag-patches
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'adil-adysh/NewPipe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Check upstream tags and apply patches to new ones
        run: |
          git remote add upstream https://github.com/TeamNewPipe/NewPipe.git
          bash .github/scripts/apply-upstream-tags.sh
