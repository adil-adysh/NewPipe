name: Propose upstream sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.repository == 'adil-adysh/NewPipe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Merge upstream into a sync branch
        id: sync
        run: |
          git remote add upstream https://github.com/TeamNewPipe/NewPipe.git
          git fetch upstream dev
          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B automation/sync-upstream
          git merge --no-edit upstream/dev
          git push --force-with-lease origin automation/sync-upstream
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Open a pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh pr list --head automation/sync-upstream --base dev --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base dev --head automation/sync-upstream \
              --title 'Sync upstream dev' \
              --body 'Merge the latest upstream dev into the fork. Review the changes and checks before merging.'
          fi
